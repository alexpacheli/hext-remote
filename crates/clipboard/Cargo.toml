[package]
name = "hext-clipboard"
description = "Hext Remote clipboard: text, watched for changes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard.workspace = true
hext-proto.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSString"] }

[lints]
workspace = true
