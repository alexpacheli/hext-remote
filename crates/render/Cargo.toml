[package]
name = "hext-render"
description = "Hext Remote video renderer (wgpu, YUV to RGB on the GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
hext-codec.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# One property of the Metal layer (see `configure`).
objc2.workspace = true

[dev-dependencies]
# The version wgpu uses: shaders are checked without a GPU.
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
