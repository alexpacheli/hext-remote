[package]
name = "hext"
description = "Hext Remote desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
gethostname.workspace = true
hext-capture.workspace = true
hext-clipboard.workspace = true
hext-codec.workspace = true
hex.workspace = true
hext-crypto.workspace = true
hext-input.workspace = true
hext-net.workspace = true
hext-proto.workspace = true
hext-render.workspace = true
hext-session.workspace = true
hext-signal.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
zeroize.workspace = true

[dev-dependencies]
hext-server = { path = "../hext-server" }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The pages embedded in the executable, also without the Tauri CLI.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
# The question before taking a file, over the session's window.
rfd = { version = "0.17", default-features = false }
tauri-plugin-single-instance = "2"
# The authenticator link as a QR code (2FA of the account).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(any(windows, target_os = "macos"))'.build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

# The Linux packages (F6): cargo deb / cargo generate-rpm, in the release
# pipeline. The program is the command line until F7.
[package.metadata.deb]
name = "hext-remote"
maintainer = "Hext Remote <suporte@hext.com.br>"
copyright = "Hext"
extended-description = "Acesso remoto: no Linux, a linha de comando (host e visualizador) até a F7."
section = "net"
priority = "optional"
assets = [
    ["target/release/hext", "usr/bin/hext-remote", "755"],
    ["../../installer/linux/hext-remote.desktop", "usr/share/applications/", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/512x512/apps/hext-remote.png", "644"],
]

[package.metadata.generate-rpm]
name = "hext-remote"
summary = "Hext Remote: acesso remoto"
assets = [
    { source = "target/release/hext", dest = "/usr/bin/hext-remote", mode = "755" },
    { source = "../../installer/linux/hext-remote.desktop", dest = "/usr/share/applications/hext-remote.desktop", mode = "644" },
    { source = "icons/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/hext-remote.png", mode = "644" },
]
