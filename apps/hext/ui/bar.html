<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Hext Remote: sessão ativa</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="bar" data-tauri-drag-region>
    <span class="dot" aria-hidden="true"></span>
    <span class="session" id="session" data-tauri-drag-region>
      <span class="short" data-tauri-drag-region>Sessão ativa</span>
      <span id="who" data-tauri-drag-region></span>
      <span class="doing" id="doing" data-tauri-drag-region></span>
    </span>
    <button type="button" id="chat">Chat</button>
    <button type="button" id="send" hidden>Enviar arquivo</button>
    <button type="button" id="end" class="danger">Encerrar</button>
  </body>
</html>
