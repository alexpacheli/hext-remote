<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Hext Remote</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="home">
    <main>
      <h1>Hext Remote</h1>

      <section>
        <h2>Seu ID</h2>
        <p class="id" id="own-id">Conectando…</p>
        <p class="name-line" id="name-line" hidden>
          <span id="own-name"></span>
          <button type="button" class="link" id="rename">Alterar</button>
        </p>
        <form id="rename-form" class="rename" hidden>
          <input
            id="new-name"
            maxlength="64"
            autocomplete="off"
            spellcheck="false"
            placeholder="Nome deste computador (vazio: o do sistema)"
            aria-label="Nome deste computador"
          />
          <button type="submit" class="primary">Salvar</button>
          <button type="button" id="rename-cancel">Cancelar</button>
        </form>
        <p class="hint">Passe este número para quem vai acessar este computador.</p>
        <p class="notice" id="notice" hidden></p>
      </section>

      <section>
        <h2>Acessar outro computador</h2>
        <form id="connect">
          <input
            id="target"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            placeholder="ID do outro computador"
            aria-label="ID do outro computador"
          />
          <button type="submit" id="connect-button" class="primary">Conectar</button>
          <input
            id="password"
            class="wide"
            type="password"
            autocomplete="off"
            placeholder="Senha, para entrar sem ninguém aceitar (opcional)"
            aria-label="Senha de acesso não assistido (opcional)"
          />
        </form>
        <p class="status" id="status" role="status"></p>
      </section>

      <section id="sessions-section" hidden>
        <h2>Sessões abertas</h2>
        <ul class="sessions" id="sessions"></ul>
      </section>

      <section id="recent-section" hidden>
        <h2>Computadores acessados</h2>
        <ul class="recent" id="recent"></ul>
      </section>
    </main>
  </body>
</html>
