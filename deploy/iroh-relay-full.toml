# The second iroh-relay, without the per-device limit, for the accounts in
# /etc/hext/relay-livre.txt (see docs/deploy.md). Like the first one: plain
# HTTP on 127.0.0.1 behind Caddy, and QUIC address discovery on UDP 7843
# (the first one has 7842) with the certificate Caddy keeps for its name.
# {$RELAY_FULL_HOST} is its name: install.sh writes it in.

enable_relay = true
http_bind_addr = "127.0.0.1:3341"
enable_quic_addr_discovery = true
# Usage counters (Prometheus), for deploy/uso.sh: this machine only.
metrics_bind_addr = "127.0.0.1:9091"

[tls]
cert_mode = "Reloading"
manual_cert_path = "/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{$RELAY_FULL_HOST}/{$RELAY_FULL_HOST}.crt"
manual_key_path = "/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{$RELAY_FULL_HOST}/{$RELAY_FULL_HOST}.key"
quic_bind_addr = "[::]:7843"
# HTTPS is Caddy's job: the relay serves HTTP only (QUIC keeps its TLS).
dangerous_http_only = true

# No [limits]: that is the point of this relay.

# Only the devices and computers of the accounts on the list, and whoever
# they open a session with, for that session (hext-server decides). The
# secret is IROH_RELAY_HTTP_BEARER_TOKEN, from /etc/hext/secrets.env.
[access.http]
url = "http://127.0.0.1:8080/v1/relay-access-full"
