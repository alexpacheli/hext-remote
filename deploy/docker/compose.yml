# The whole Hext Remote server with Docker: hext-server (IDs, presence,
# signaling), iroh-relay (sessions that cannot connect directly) and Caddy
# (TLS from Let's Encrypt). From this folder, with .env filled in (see
# .env.example):
#
#   docker compose up -d --build
#
# Only Caddy (80 and 443 TCP) and the relay's address discovery (7842 UDP)
# are reachable from the internet.

name: hext

services:
  hext-server:
    build:
      context: ../..
      dockerfile: apps/hext-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HEXT_RELAY_TOKEN: ${HEXT_RELAY_TOKEN:?gere com openssl rand -hex 32}
    volumes:
      - server:/data
    # No published port: only Caddy (X-Forwarded-For) and the relay reach it.

  # Creates, in Caddy's volume, the folder where Caddy keeps the relay's
  # certificate, so the relay can mount only that folder (below) even before
  # Caddy has obtained it. Runs once and exits.
  cert-dir:
    image: caddy:2.10.2
    environment:
      RELAY_HOST: relay.${HEXT_DOMAIN:?defina o domínio no .env}
    entrypoint:
      - sh
      - -c
      - umask 077 && mkdir -p "/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/$$RELAY_HOST"
    volumes:
      - caddy-data:/data
    restart: "no"

  relay:
    build:
      context: .
      dockerfile: relay.Dockerfile
    restart: unless-stopped
    environment:
      RELAY_HOST: relay.${HEXT_DOMAIN:?defina o domínio no .env}
      IROH_RELAY_HTTP_BEARER_TOKEN: ${HEXT_RELAY_TOKEN}
    volumes:
      # Only the folder of Caddy's certificate for the relay's name, for QUIC
      # (read only): not the other names' keys. (subpath: Docker 26 or newer.)
      - type: volume
        source: caddy-data
        target: /cert
        read_only: true
        volume:
          subpath: caddy/certificates/acme-v02.api.letsencrypt.org-directory/relay.${HEXT_DOMAIN}
    # Nothing to write but its configuration, in /tmp; no privileges. (It
    # keeps the user root, without any capability, only to read the key,
    # which Caddy writes as root with mode 600.)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "7842:7842/udp"
      # The usage counters, for deploy/uso.sh on this server only.
      - "127.0.0.1:9090:9090"
    depends_on:
      hext-server:
        condition: service_started
      cert-dir:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      SIGNAL_HOST: signal.${HEXT_DOMAIN}
      RELAY_HOST: relay.${HEXT_DOMAIN}
      SIGNAL_UPSTREAM: hext-server:8080
      RELAY_UPSTREAM: relay:3340
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - hext-server
      - relay

volumes:
  # The database: back it up. Without it, the computers get new IDs.
  server:
  caddy-data:
  caddy-config:
