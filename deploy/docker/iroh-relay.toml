# iroh-relay in Docker, behind Caddy: plain HTTP inside the compose network
# (Caddy does TLS on 443), and QUIC address discovery on UDP 7842 with the
# certificate Caddy keeps for the relay's name ({$RELAY_HOST}, written in by
# relay-start.sh), reloaded as Caddy renews it.

enable_relay = true
http_bind_addr = "0.0.0.0:3340"
enable_quic_addr_discovery = true
# Usage counters (Prometheus), for deploy/uso.sh: published on the host's
# 127.0.0.1 only (compose.yml).
metrics_bind_addr = "0.0.0.0:9090"

[tls]
cert_mode = "Reloading"
manual_cert_path = "/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{$RELAY_HOST}/{$RELAY_HOST}.crt"
manual_key_path = "/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{$RELAY_HOST}/{$RELAY_HOST}.key"
quic_bind_addr = "0.0.0.0:7842"
# HTTPS is Caddy's job: the relay serves HTTP only (QUIC keeps its TLS).
dangerous_http_only = true

# Each device sends at most 5 Mbit/s through the relay (625 kB/s, with bursts
# of up to a second): one heavy session cannot take the whole link, and the
# app lowers its video to fit. Direct (P2P) sessions are not limited.
[limits.client.rx]
bytes_per_second = 625000
max_burst_bytes = 625000

# Only devices registered with hext-server may use the relay. The secret is
# IROH_RELAY_HTTP_BEARER_TOKEN (HEXT_RELAY_TOKEN in .env).
[access.http]
url = "http://hext-server:8080/v1/relay-access"
