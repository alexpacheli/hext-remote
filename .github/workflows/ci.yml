name: CI

on:
  # Branches with a PR are checked by pull_request; push only for main (no
  # double runs).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests only: reading the code is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }} # DIAGNÓSTICO, temporário
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The server of a copy of the project (see release.yml). Empty, ours.
  HEXT_SERVER: ${{ vars.HEXT_SERVER }}
  HEXT_RELAY: ${{ vars.HEXT_RELAY }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A normal run takes under 20 minutes; a stuck test should not hold the
    # job for the 6 hours GitHub allows.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: HextRemote-windows-x64
          # DIAGNÓSTICO, temporário: só o Windows.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads rust-toolchain.toml and caches the cargo registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.targets }}

      # The interface on Linux: WebKitGTK, to build with.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # DIAGNÓSTICO, temporário.
      - name: Diag bind
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "1"
        run: |
          dbg="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64"
          ls "$dbg" | head -50 || true
          exe=$(cargo test -p hext --bin hext --locked --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "hext") | .executable')
          echo "exe: $exe"
          MSYS2_ARG_CONV_EXCL='*' "$dbg/gflags.exe" /p /enable "$(basename "$exe")" /full
          MSYS2_ARG_CONV_EXCL='*' "$dbg/gflags.exe" /p
          for i in $(seq 1 8); do
            echo "=== rodada $i $(date +%T)"
            timeout 1500 "$dbg/cdb.exe" -g -G -lines \
              -y "$(dirname "$exe");srv*C:\\symbols*https://msdl.microsoft.com/download/symbols" \
              -c ".echo HEXT_PARADA; .lastevent; .ecxr; kn 80; !heap -p -a @@(@\$exr_param1); ~*kn 30; q" \
              "$exe" -q --test-threads=8 > out.txt 2>&1 || echo "saiu: $?"
            if grep -q HEXT_PARADA out.txt; then cat out.txt; break; fi
            tail -5 out.txt
          done
          echo "=== fim $(date +%T)"

      - name: Test
        run: cargo test --workspace --locked

      - name: Server image
        if: runner.os == 'Linux'
        run: docker build -f apps/hext-server/Dockerfile -t hext-server .

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p hext -p hext-server --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/hext.exe dist/HextRemote.exe
          cp target/x86_64-pc-windows-msvc/release/hext-server.exe dist/hext-server.exe

      - name: Build release (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p hext -p hext-server --target aarch64-apple-darwin
          cargo build --release --locked -p hext -p hext-server --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/HextRemote \
            target/aarch64-apple-darwin/release/hext \
            target/x86_64-apple-darwin/release/hext
          lipo -create -output dist/hext-server \
            target/aarch64-apple-darwin/release/hext-server \
            target/x86_64-apple-darwin/release/hext-server
          lipo -info dist/HextRemote dist/hext-server

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p hext -p hext-server --target x86_64-unknown-linux-gnu
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/hext dist/hext-remote
          cp target/x86_64-unknown-linux-gnu/release/hext-server dist/hext-server

      - name: Smoke test
        shell: bash
        run: for bin in dist/*; do "$bin" --version; done

      # The interface and the viewer (with video) on Linux, from the .deb on
      # a clean Ubuntu: what the package brings is all they run with. The
      # pictures stay with the run. The container is the runner's own Ubuntu
      # (the .deb asks for the libraries it was built against); older
      # distros are the release's test, which builds on 22.04.
      - name: Interface (Linux, from the .deb)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p hext --target x86_64-unknown-linux-gnu --no-build --output pkg/
          . /etc/os-release
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/pkg:/pkg" "ubuntu:$VERSION_ID" \
            bash /src/installer/linux/package-test.sh "/pkg/$(basename pkg/*.deb)" /pkg/shots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux' && always()
        with:
          name: interface-linux
          path: pkg/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
