name: CI

on:
  # Branches with a PR are checked by pull_request; push only for main (no
  # double runs).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests only: reading the code is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The server of a copy of the project (see release.yml). Empty, ours.
  HEXT_SERVER: ${{ vars.HEXT_SERVER }}
  HEXT_RELAY: ${{ vars.HEXT_RELAY }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A normal run takes under 20 minutes; a stuck test should not hold the
    # job for the 6 hours GitHub allows.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: HextRemote-windows-x64
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: HextRemote-macos-universal
          - name: Linux x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            artifact: hext-remote-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads rust-toolchain.toml and caches the cargo registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.targets }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Server image
        if: runner.os == 'Linux'
        run: docker build -f apps/hext-server/Dockerfile -t hext-server .

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p hext -p hext-server --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/hext.exe dist/HextRemote.exe
          cp target/x86_64-pc-windows-msvc/release/hext-server.exe dist/hext-server.exe

      - name: Build release (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p hext -p hext-server --target aarch64-apple-darwin
          cargo build --release --locked -p hext -p hext-server --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/HextRemote \
            target/aarch64-apple-darwin/release/hext \
            target/x86_64-apple-darwin/release/hext
          lipo -create -output dist/hext-server \
            target/aarch64-apple-darwin/release/hext-server \
            target/x86_64-apple-darwin/release/hext-server
          lipo -info dist/HextRemote dist/hext-server

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p hext -p hext-server --target x86_64-unknown-linux-gnu
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/hext dist/hext-remote
          cp target/x86_64-unknown-linux-gnu/release/hext-server dist/hext-server

      - name: Smoke test
        shell: bash
        run: for bin in dist/*; do "$bin" --version; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
