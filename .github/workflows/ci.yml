name: CI

on:
  # Branches with a PR are checked by pull_request; push only for main (no
  # double runs).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests only: reading the code is enough.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The server of a copy of the project (see release.yml). Empty, ours.
  HEXT_SERVER: ${{ vars.HEXT_SERVER }}
  HEXT_RELAY: ${{ vars.HEXT_RELAY }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A normal run takes under 20 minutes; a stuck test should not hold the
    # job for the 6 hours GitHub allows.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: HextRemote-windows-x64
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: HextRemote-macos-universal
          - name: Linux x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            artifact: hext-remote-linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            artifact: hext-remote-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reads rust-toolchain.toml and caches the cargo registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.targets }}

      # The interface on Linux: WebKitGTK, to build with. For the host's
      # tests: a virtual X server, xkbcomp (the Brazilian keymap), libva's
      # and libpipewire's headers (the structures written by hand), and a
      # PipeWire with a test video source.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb x11-xkb-utils libva-dev \
            libpipewire-0.3-dev pipewire pipewire-bin wireplumber dbus \
            gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-base

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      # The Linux host (F7) on a real X server: the capture sees what is
      # drawn (XShm, Damage), XTest moves the pointer and presses keys, the
      # ABNT2 keys land where the Brazilian layout of the system's xkb data
      # puts them, and the VA-API structures match libva's headers.
      - name: Host on X11 (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          printf 'xkb_keymap { xkb_keycodes { include "evdev+aliases(qwerty)" }; xkb_types { include "complete" }; xkb_compat { include "complete" }; xkb_symbols { include "pc+br(abnt2)+inet(evdev)" }; };\n' > "$RUNNER_TEMP/br.km"
          xkbcomp -w0 -xkb "$RUNNER_TEMP/br.km" "$RUNNER_TEMP/br.xkb"
          cc crates/codec/va-layout.c -o "$RUNNER_TEMP/va-layout"
          "$RUNNER_TEMP/va-layout" > "$RUNNER_TEMP/va-layout.txt"
          HEXT_TEST_XKB_KEYMAP="$RUNNER_TEMP/br.xkb" HEXT_VA_LAYOUT="$RUNNER_TEMP/va-layout.txt" \
            xvfb-run -a -s '-screen 0 1280x800x24' \
            cargo test --locked -p hext-capture -p hext-input -p hext-codec -- --ignored x11_ layouts_match_libva

      # The Wayland host (F7, milestone 5): the PipeWire structures match its
      # headers, and a real PipeWire stream (a test source standing in for
      # the desktop's screen) comes out as BGRA. The portal itself (the
      # desktop's question, the restore token, input) needs a real desktop:
      # the field checklist covers it.
      - name: Host on Wayland (Linux, PipeWire)
        if: runner.os == 'Linux'
        run: |
          cc $(pkg-config --cflags libpipewire-0.3) crates/capture/pw-layout.c -o "$RUNNER_TEMP/pw-layout"
          "$RUNNER_TEMP/pw-layout" > "$RUNNER_TEMP/pw-layout.txt"
          HEXT_PW_LAYOUT="$RUNNER_TEMP/pw-layout.txt" bash crates/capture/pipewire-source.sh \
            cargo test --locked -p hext-capture -- --ignored layouts_match_pipewire pipewire_

      # vendor/netwatch replaces netwatch's WMI query (see its PATCHED.md).
      # The patch only applies to that exact version: if iroh moves to
      # another, cargo just warns and the WMI query (and its crashes) would
      # come back unnoticed.
      - name: No WMI in the dependencies
        if: runner.os == 'Linux'
        run: |
          if grep -qx 'name = "wmi"' Cargo.lock; then
            echo "::error::wmi voltou ao Cargo.lock: o patch do netwatch (vendor/netwatch) não vale mais para a versão que o iroh usa."
            cargo tree -i wmi --target x86_64-pc-windows-msvc || true
            exit 1
          fi

      # The patched part of vendor/netwatch, outside the workspace, is
      # tested here, where it runs (the home router test needs a home).
      - name: Test vendor/netwatch
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path vendor/netwatch/Cargo.toml --target-dir target --lib -- interfaces:: --skip test_likely_home_router

      - name: Server image
        if: runner.os == 'Linux'
        run: docker build -f apps/hext-server/Dockerfile -t hext-server .

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p hext -p hext-server --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/hext.exe dist/HextRemote.exe
          cp target/x86_64-pc-windows-msvc/release/hext-server.exe dist/hext-server.exe

      - name: Build release (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p hext -p hext-server --target aarch64-apple-darwin
          cargo build --release --locked -p hext -p hext-server --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/HextRemote \
            target/aarch64-apple-darwin/release/hext \
            target/x86_64-apple-darwin/release/hext
          lipo -create -output dist/hext-server \
            target/aarch64-apple-darwin/release/hext-server \
            target/x86_64-apple-darwin/release/hext-server
          lipo -info dist/HextRemote dist/hext-server

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p hext -p hext-server --target ${{ matrix.targets }}
          mkdir dist
          cp target/${{ matrix.targets }}/release/hext dist/hext-remote
          cp target/${{ matrix.targets }}/release/hext-server dist/hext-server

      - name: Smoke test
        shell: bash
        run: for bin in dist/*; do "$bin" --version; done

      # The interface and the viewer (with video) on Linux, from the .deb on
      # a clean Ubuntu: what the package brings is all they run with. The
      # pictures stay with the run. The container is the runner's own Ubuntu
      # (the .deb asks for the libraries it was built against); older
      # distros are the release's test, which builds on 22.04.
      - name: Interface (Linux, from the .deb)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p hext --target ${{ matrix.targets }} --no-build --output pkg/
          . /etc/os-release
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/pkg:/pkg" "ubuntu:$VERSION_ID" \
            bash /src/installer/linux/package-test.sh "/pkg/$(basename pkg/*.deb)" /pkg/shots

      # The .rpm too (x86_64 here; the release builds both), on a Fedora whose
      # glibc is not older than the runner's Ubuntu (26.04: 2.43, Fedora 44).
      - name: Interface (Linux, from the .rpm)
        if: runner.os == 'Linux' && matrix.targets == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p apps/hext --target ${{ matrix.targets }} --output pkg/
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/pkg:/pkg" fedora:44 \
            bash /src/installer/linux/package-test.sh "/pkg/$(basename pkg/*.rpm)" /pkg/shots-fedora

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux' && always()
        with:
          name: interface-${{ matrix.artifact }}
          path: pkg/shots*/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
